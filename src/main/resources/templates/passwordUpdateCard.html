<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>FitPulse — Password updated</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/passwordUpdateCard.css}">
</head>
<body>

<div class="card">
    <div class="check">
        <svg viewBox="0 0 24 24" fill="none" stroke="#C8FF6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5z"></path>
            <polyline points="9 14 11 16 15 12"></polyline>
        </svg>
    </div>

    <h1>Password updated</h1>
    <p class="subtitle">Your password has been changed successfully. Use your new password the next time you log in.</p>

    <div class="actions">
        <a class="btn btn-primary" th:href="@{/profile/{id}(id=${user.id})}">Back to profile</a>
    </div>
</div>

</body>
</html>
