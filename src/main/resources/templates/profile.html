<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>FitPulse — Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/profile.css}">
</head>
<body>

<div class="app">
    <nav class="nav">
        <div class="brand">Fit<span>Pulse</span></div>
        <div class="nav-group">
            <div class="nav-label">Train</div>
            <a class="nav-item" th:href="@{/dashboard}"><span class="dot"></span> Browse sessions</a>
            <a class="nav-item " th:href="@{/bookings}"><span class="dot"></span> My bookings</a>
            <a class="nav-item" th:href="@{/subscriptions}"><span class="dot"></span> Subscriptions</a>
        </div>
        <div class="nav-group">
            <div class="nav-label">Account</div>
            <a class="nav-item" th:href="@{/wallet}"><span class="dot"></span> Wallet</a>
            <a class="nav-item active" th:href="@{/profile/{id}(id=${user.id})}"><span class="dot"></span> Profile</a>
        </div>
        <div class="nav-bottom">
            <a class="user-card" href="profile.html">
                <div class="user-card">
                    <div class="avatar"></div>
                    <div>
                        <div th:text="${user.firstName + ' ' +user.lastName}" class="name">Alex Petrov</div>
                        <div th:text="${user.walletBalance}" class="bal">€142.50</div>
                    </div>
                </div>
            </a>
        </div>
    </nav>

    <main>
        <div class="top">
            <h1>Profile</h1>
            <p>Your account details.</p>
        </div>

        <div class="profile-header">
            <div class="big-avatar"></div>
            <div>
                <div th:text="${user.firstName+ ' ' +user.lastName}" class="name">Alex Petrov</div>
                <div th:text="${user.email}" class="email">alex.petrov@example.com</div>
            </div>
            <span th:text="${user.role}" class="role-badge">USER</span>
        </div>
        
        <h2>Account details</h2>
        <div class="card">
            <form th:action="@{/profile/{id}(id=${user.id})}" th:method="PATCH">
                <div class="row2">
                    <div class="field">
                        <label for="p-first">First name</label>
                        <input th:value="${user.firstName}" id="p-first" type="text"  />
                    </div>
                    <div class="field">
                        <label for="p-last">Last name</label>
                        <input th:value="${user.lastName}" id="p-last" type="text"  />
                    </div>
                </div>
                <div class="field">
                    <label for="p-email">Email</label>
                    <input th:value="${user.email}" id="p-email" type="email"  />
                </div>
                <div class="field">
                    <label for="p-role">Role</label>
                    <input th:value="${user.role.name()}" id="p-role" type="text"  disabled />
                </div>
                <button type="submit" class="save-btn">Save changes</button>
            </form>
        </div>

        <h2>Change password</h2>
        <div class="card">
            <form th:action="@{/profile/{id}(id=${user.id})/password}" th:method="PATCH">
                <div class="field">
                    <label for="p-current">Current password</label>
                    <input id="p-current" type="password" placeholder="••••••••" />
                </div>
                <div class="row2">
                    <div class="field">
                        <label for="p-new">New password</label>
                        <input id="p-new" type="password" placeholder="At least 8 characters" />
                    </div>
                    <div class="field">
                        <label for="p-confirm">Confirm new password</label>
                        <input id="p-confirm" type="password" placeholder="Repeat new password" />
                    </div>
                </div>
                <button type="submit" class="save-btn">Update password</button>
            </form>
        </div>

        <form th:action="@{/profile/{id}(id=${user.id})/logout}" th:method="POST">
            <div class="card danger-card">
                <h2>Log out</h2>
                <p style="color:var(--text-dim); font-size:13px; margin-bottom:16px;">
                    End your current session on this device.
                </p>
                <button type="submit" class="logout-btn">Log out</button>
            </div>
        </form>

    </main>
</div>

</body>
</html>
