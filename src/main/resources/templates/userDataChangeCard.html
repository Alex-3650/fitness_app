<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>FitPulse — Profile updated</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/userDataChangeCard.css}">
</head>
<body>

<div class="card">
    <div class="check">
        <svg viewBox="0 0 24 24" fill="none" stroke="#C8FF6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
    </div>

    <h1>Profile updated</h1>
    <p class="subtitle">Your account details have been saved.</p>

    <div class="details">
        <div class="d-row">
            <span class="l">Name</span>
            <span class="v" th:text="${updatedUser.firstName + ' ' + updatedUser.lastName}">Alex Petrov</span>
        </div>
        <div class="d-row">
            <span class="l">Email</span>
            <span class="v" th:text="${updatedUser.email}">alex.petrov@example.com</span>
        </div>
        <div class="d-row">
            <span class="l">Role</span>
            <span class="v" th:text="${updatedUser.role.name()}">USER</span>
        </div>
    </div>

    <div class="actions">
        <a class="btn btn-primary" th:href="@{/profile/{id}(id=${updatedUser.id})}">Back to profile</a>
        <a class="btn btn-ghost" th:href="@{/dashboard}">Browse sessions</a>
    </div>
</div>

</body>
</html>
